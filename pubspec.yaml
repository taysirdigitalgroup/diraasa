name: diraasa
description: Carnet d'études arabes et المختار الصحاح hors ligne.
publish_to: none
version: 2.3.0+40
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/diraasa_internal.png
    - assets/devotion/quran_hafs.json
    - assets/devotion/quran_warsh.json
    - assets/devotion/hisn.json
    - assets/devotion/audio_sources.json
    - assets/devotion/hadith_bukhari.json
    - assets/devotion/hadith_muslim.json
  fonts:
    - family: UthmaniHafs
      fonts:
        - asset: assets/fonts/KFGQPC-Hafs-Uthmanic.ttf
    - family: UthmaniWarsh
      fonts:
        - asset: assets/fonts/KFGQPC-Warsh-Uthmanic.ttf
